AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS url shortener

Resources:
  HttpApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration: 
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [authorization, content-type]
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
  
  UrlShortenerTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: code 
        Type: String

  UrlShortenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shorten.handler
      Runtime: nodejs24.x
      CodeUri: ./src
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlShortenerTable
      Events:
        ShortenRoute:
          Type: HttpApi
          Properties:
            Path: /shorten
            Method: POST
            ApiId: !Ref HttpApiGateway
            
  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: redirect.handler
      Runtime: nodejs24.x 
      CodeUri: ./src
      Policies: 
        - DynamoDBReadPolicy:
            TableName: !Ref UrlShortenerTable
      Events:
        RedirectRoute:
          Type: HttpApi
          Properties:
            Path: /{code}
            Method: GET 
            ApiId: !Ref HttpApiGateway
